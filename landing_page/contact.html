<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — 49Agents</title>
<meta name="description" content="Get in touch with the 49Agents team.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=JetBrains+Mono:wght@400&family=Montserrat:wght@200;300&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #da7756;
    --accent-rgb: 218, 119, 86;
    --accent-dim: rgba(218, 119, 86, 0.5);
    --accent-glow: rgba(218, 119, 86, 0.3);
  }

  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  ::-webkit-scrollbar { width: 1px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(var(--accent-rgb), 0.4); }
  html { scrollbar-width: thin; scrollbar-color: rgba(var(--accent-rgb), 0.4) transparent; }

  html {
    scroll-behavior: smooth;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #050509;
    color: #fff;
    overflow-x: hidden;
    line-height: 1.6;
  }

  /* ─── NAV ─── */

  .site-nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: rgba(5, 5, 9, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  }

  .site-nav-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
  }

  .nav-brand {
    font-family: 'Montserrat', sans-serif;
    font-size: 1rem;
    font-weight: 300;
    color: rgba(255, 255, 255, 0.82);
    text-decoration: none;
    letter-spacing: 0.01em;
    transition: color 0.2s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .nav-brand:hover {
    color: #fff;
  }

  .nav-logo {
    width: 20px;
    height: auto;
    opacity: 0.85;
  }

  .nav-brand:hover .nav-logo {
    opacity: 1;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .nav-links a {
    font-family: 'Inter', sans-serif;
    font-size: 0.82rem;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.4);
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .nav-links a:hover {
    color: rgba(255, 255, 255, 0.75);
  }

  /* ─── DUAL CTA ─── */

  .dual-cta {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn-github {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #0d0d14;
    color: rgba(255,255,255,0.85);
    font-family: 'Inter', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    padding: 12px 24px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    text-decoration: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .btn-github:hover {
    border-color: rgba(255,255,255,0.25);
    background: #141420;
  }
  .btn-github svg { width: 18px; height: 18px; fill: rgba(255,255,255,0.7); flex-shrink: 0; }
  .btn-start {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    text-decoration: none;
    transition: filter 0.2s, transform 0.2s;
    cursor: pointer;
  }
  .btn-start:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-start svg { width: 16px; height: 16px; flex-shrink: 0; }
  .site-nav .btn-github, .site-nav .btn-start { padding: 7px 16px; font-size: 0.78rem; font-weight: 600; }
  .site-nav .btn-github svg { width: 14px; height: 14px; }
  .site-nav .btn-start svg { width: 12px; height: 12px; }
  .nav-links .btn-start { color: #fff; }

  /* ─── PAGE LAYOUT ─── */

  .page-wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 120px 24px 80px;
  }

  /* ─── PAGE HEADER ─── */

  .page-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 400;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 20px;
    opacity: 0.9;
    text-align: center;
  }

  .page-title {
    font-family: 'Inter', sans-serif;
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 200;
    color: rgba(255, 255, 255, 0.92);
    line-height: 1.15;
    letter-spacing: -0.02em;
    margin-bottom: 32px;
    text-align: center;
  }

  /* ─── CONTACT FORM ─── */

  .contact-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .contact-input {
    width: 100%;
    padding: 14px 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: rgba(255,255,255,0.85);
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 300;
    outline: none;
    transition: border-color 0.2s;
  }
  .contact-input:focus {
    border-color: rgba(var(--accent-rgb), 0.5);
  }
  .contact-input::placeholder {
    color: rgba(255,255,255,0.25);
  }
  .contact-textarea {
    min-height: 120px;
    resize: vertical;
  }

  /* ─── FOOTER ─── */

  .footer {
    background: #050509;
    padding: 0 24px 40px;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .footer-inner {
    font-size: 0.75rem;
    font-weight: 300;
    color: rgba(255, 255, 255, 0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .footer a {
    color: rgba(255, 255, 255, 0.25);
    text-decoration: none;
    transition: color 0.25s ease;
  }

  .footer a:hover {
    color: rgba(255, 255, 255, 0.45);
  }

  .footer-dot {
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    flex-shrink: 0;
  }

  /* ─── RESPONSIVE ─── */

  @media (max-width: 600px) {
    .site-nav-inner {
      flex-direction: column;
      gap: 10px;
      padding: 12px 16px;
    }

    .nav-links {
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .nav-links a {
      font-size: 0.68rem;
      padding: 4px 0;
    }

    .site-nav .dual-cta { gap: 6px; }
    .site-nav .btn-github, .site-nav .btn-start { padding: 6px 12px; font-size: 0.72rem; }

    .btn-github span {
      display: none;
    }

    .page-wrap {
      padding: 100px 20px 60px;
    }
  }
</style>
</head>
