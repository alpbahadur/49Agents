# Drop-in for a SYSTEM-level 49agents install.
#
# Install as:
#   sudo mkdir -p /etc/systemd/system/49agents.service.d
#   sudo cp deploy/systemd/49agents.service.d-override.conf \
#           /etc/systemd/system/49agents.service.d/override.conf
#   sudo systemctl daemon-reload
#
# daemon-reload is enough. Do NOT `systemctl restart` to apply this — a restart
# is the exact event this drop-in exists to survive, and it would kill every
# terminal in the cgroup.
#
# ---------------------------------------------------------------------------
# Incident 2026-08-13 03:43:03 UTC
#
#   kernel: oom-kill:constraint=CONSTRAINT_NONE,...,global_oom,
#           task_memcg=/system.slice/49agents.service,task=chrome
#   systemd: 49agents.service: A process of this unit has been killed by the
#            OOM killer.
#   systemd: 49agents.service: Failed with result 'oom-kill'.
#
# The kernel hit a host-wide OOM and killed one process: a 4.27 GiB Chrome
# renderer that a browser MCP server had launched seconds earlier. It picked
# correctly — that was the fattest task on the box.
#
# What turned one dead renderer into an outage was systemd, not the kernel.
# The agent spawns ttyd -> tmux -> bash, so this cgroup holds the user's whole
# interactive session: every terminal, every agent session inside them, the MCP
# servers, and unrelated background work. OOMPolicy defaults to "stop", so the
# child's death stopped the unit; KillMode defaults to "control-group", so the
# stop killed all 50 processes; Restart=always then rebuilt an empty cgroup.
# Five pending timers died 90 minutes before they were due.
# ---------------------------------------------------------------------------

[Service]
# THE FIX. A child being OOM-killed must not stop the connector.
# This one line would have made 2026-08-13 a log entry instead of an outage.
OOMPolicy=continue

# Backstop only, and safe ONLY because OOMPolicy=continue is set above.
# Measured on the affected host: memory.current 5.2 GiB, memory.peak 6.92 GiB
# on a 15.3 GiB machine. These sit ~45% above that peak so they never fire in
# normal operation; they exist so a runaway is contained inside this cgroup
# instead of taking the host to a global OOM and putting sshd, tailscaled and
# your way back into the box at risk.
#
# Do NOT lower these to 8G/6G. MemoryHigh=6G is BELOW the observed peak and
# would throttle the user's terminals into permanent reclaim stalls from the
# moment it is applied.
MemoryAccounting=yes
MemoryHigh=10G
MemoryMax=12G

# MemoryHigh reclaim needs somewhere to put pages or it throttles with no
# relief. Note this cgroup's memory.swap.current is currently 0 — its working
# set is hot and does not page out — so treat this as insurance, not a fix.
MemorySwapMax=8G

# systemd-oomd is active on this host. Prefer it to reclaim elsewhere.
ManagedOOMPreference=avoid

# Deliberately NOT set — each was evaluated and rejected:
#
#   KillMode=process   Leaves ttyd holding ports 7700-7799 after a stop. The
#                      agent's own startup sweep then SIGKILLs them anyway, so
#                      the terminals die regardless — just seconds later, and
#                      now with a port conflict in between.
#   KillMode=mixed     SIGTERMs the main process, then SIGKILLs the entire
#                      cgroup once TimeoutStopSec expires. ttyd and tmux have
#                      no parent-death linkage, so they are still there when it
#                      fires. Same blast radius, delayed, and unblockable.
#   OOMScoreAdjust     Inherited by every child. A negative value shields the
#                      whole session and steers the kernel toward sshd or the
#                      VPN instead. Exactly backwards on a headless box.
#   Restart=on-failure Out of scope for this incident; changes behaviour on
#                      clean operator-initiated exits.
#
# The real fix is architectural and belongs in the agent, not here: spawn each
# ttyd/tmux into its own transient scope
#   systemd-run --user --scope --unit=49agents-term-<uuid> -- ttyd ...
# so the connector's lifecycle stops governing the user's session at all.
# Terminals would then survive OOM, agent crash, and deliberate restarts.
